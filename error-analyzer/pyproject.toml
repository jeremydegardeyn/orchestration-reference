[project]
name = "error_analyzer"
version = "0.1.0"
description = "Shared ADK agent: retrieve, analyze, and alert on GCP pipeline job errors (Dataflow, Dataform). Called by both the Composer and Dagster orchestration platforms."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.5.0",
    "google-genai>=1.16.1",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "google-cloud-dataflow-client>=0.9.0",
    "google-cloud-dataform>=0.6.2",
    "pydantic>=2.10",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "markdown>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.26"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["error_analyzer*"]
