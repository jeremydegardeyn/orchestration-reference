---
# gcs_to_bigquery pattern config. A new file here = a new DAG (dag_id: gcs_to_bigquery__ga4_clickstream).
dag_attr:
  tags:
    - name: "ga4"
    - name: "clickstream"
  alert_after_run_minutes: 75

workflow_type: "dataflow"   # "dataflow" launches the flex template; "dts" uses BigQuery Data Transfer

schedules:
  - interval: "0 6 * * *"
    timezone: "America/New_York"
    executions:
      gcs_to_bigquery:
        source:
          landing_bucket: "llb-edp-ga-clickstream-{{ env }}"
          file_pattern: "ga4_events_*.avro"
          field_delimiter: "|"
          skip_leading_rows: 0
          quote_char: "\""
          max_bad_records: 0
          is_truncate: false
        dataflow:
          max_workers: 4
          disk_size_gb: 25
          machine_type: "n1-standard-4"
        sink:
          raw_dataset: "staging"
          raw_table: "ga4_events_raw"
          error_bucket: "gs://llb-edp-gcs-to-bq-error-{{ env }}/clickstream"
